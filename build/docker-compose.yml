services:
  taskmanagementsystem.api:
    image: taskmanagementsystem.api
    build:
      context: .
      dockerfile: ../src/TaskManagementSystem.Api/Dockerfile
    ports:
      - "5197:8080"
    environment:
      ConnectionStrings__TaskManagementSystemDb: "Server=taskmanagementsystem.mysql;Database=TaskManagementSystemDb;User=tms_user;Password=tms_pass;"
      RabbitMqSettings__TaskExchange: task.management.events
      RabbitMqSettings__TaskQueue: task.management.docker.consumer
      RabbitMqSettings__Host: taskmanagementsystem.rabbitmq
      RabbitMqSettings__Username: guest
      RabbitMqSettings__Password: guest
    depends_on:
      taskmanagementsystem.rabbitmq:
        condition:
          service_healthy
      taskmanagementsystem.mysql:
        condition:
          service_healthy

  taskmanagementsystem.mysql:
    image: mysql:8.3
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: TaskManagementSystemDb
      MYSQL_USER: tms_user
      MYSQL_PASSWORD: tms_pass
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      retries: 5
    volumes:
      - task_management_system_mysql:/var/lib/postgresql/data

  taskmanagementsystem.rabbitmq:
    image: rabbitmq:3-management
    restart: always
    ports:
      - "5672:5672"       # App
      - "15672:15672"     # UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  task_management_system_mysql: